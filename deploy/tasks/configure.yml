# This stage only renders private pending configuration. Live installation,
# secret merging, service reload and activation remain separate integrations.
- name: Inspect existing backend environment without reading its contents
  ansible.builtin.stat:
    path: "{{ atoms_root }}/shared/config/backend.env"
    follow: false
    get_checksum: false
    get_mime: false
    get_attributes: false
  register: atoms_existing_env
  no_log: true

- name: Refuse an unexpected environment file type
  ansible.builtin.assert:
    that: not atoms_existing_env.stat.exists or atoms_existing_env.stat.isreg | default(false)
    quiet: true
    fail_msg: Existing backend environment must be a regular file; no changes applied.

- name: Inspect the pending directory without following a link
  ansible.builtin.stat:
    path: "{{ atoms_root }}/shared/config/pending"
    follow: false
    get_checksum: false
    get_mime: false
    get_attributes: false
  register: atoms_pending_directory
  no_log: true

- name: Refuse an unexpected pending directory type
  ansible.builtin.assert:
    that: not atoms_pending_directory.stat.exists or atoms_pending_directory.stat.isdir | default(false)
    quiet: true
    fail_msg: Pending configuration must use an owned directory, not a file or symlink.

- name: Create the owned pending configuration directory
  ansible.builtin.file:
    path: "{{ atoms_root }}/shared/config/pending"
    state: directory
    mode: '0700'
  no_log: true

- name: Render unit and proxy configuration without installing them
  ansible.builtin.template:
    src: "{{ playbook_dir }}/templates/{{ item.source }}"
    dest: "{{ atoms_root }}/shared/config/pending/{{ item.target }}"
    mode: '0600'
  loop:
    - {source: atoms-backend.service.j2, target: atoms-backend.service}
    - {source: nginx-site.conf.j2, target: nginx-site.conf}
  no_log: true

- name: Stage initial environment only when none already exists
  ansible.builtin.template:
    src: "{{ playbook_dir }}/templates/backend.env.j2"
    dest: "{{ atoms_root }}/shared/config/pending/backend.env"
    mode: '0600'
  when: not atoms_existing_env.stat.exists
  no_log: true

- name: Remove only our obsolete pending environment when the live file exists
  ansible.builtin.file:
    path: "{{ atoms_root }}/shared/config/pending/backend.env"
    state: absent
  when: atoms_existing_env.stat.exists
  no_log: true
