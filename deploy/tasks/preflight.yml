- name: Prepare private transaction context
  ansible.builtin.import_tasks: prepare-context.yml

- name: Inspect target ownership and resolve a verified cached package
  ansible.builtin.command:
    argv: [python3, "{{ atoms_stage.path }}/kit/deploy/remote.py", resolve, "{{ atoms_stage.path }}/context.json", --result, "{{ atoms_stage.path }}/result.json"]
  become: true
  register: atoms_resolution_command
  failed_when: false
  changed_when: false
  no_log: true

- name: Decode bounded target preflight result
  ansible.builtin.set_fact:
    atoms_resolution: "{{ atoms_resolution_command.stdout | from_json }}"
  no_log: true

- name: Refuse failed target prerequisites or unknown ownership
  ansible.builtin.assert:
    that: atoms_resolution.ok | default(false)
    quiet: true
    fail_msg: Target preflight failed; inspect the bounded result code in private evidence.

- name: Select existing immutable package when inputs match
  ansible.builtin.set_fact:
    atoms_selected_release: "{{ atoms_resolution.directory }}"
  when: atoms_resolution.found
  no_log: true
