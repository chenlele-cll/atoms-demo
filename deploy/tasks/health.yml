- name: Require committed target identity and observed health
  ansible.builtin.assert:
    that:
      - atoms_result.ok
      - atoms_result.deploymentVerified
      - atoms_result.releaseId is match('^[a-f0-9-]{36}$')
      - atoms_result.releaseDigest is match('^[a-f0-9]{64}$')
    quiet: true
    fail_msg: Target health and committed identity were not confirmed.
