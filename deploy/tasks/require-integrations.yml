- name: Require a prepared control-node request before any target connection
  ansible.builtin.assert:
    that:
      - atoms_request is defined
      - atoms_request.run_id is match('^[a-f0-9-]{36}$')
      - atoms_request.operation in ['apply', 'status']
    quiet: true
    fail_msg: DEP-003 requires deploy.sh to validate and prepare the request; direct unprepared execution is refused.
