[defaults]
host_key_checking = True
retry_files_enabled = False
display_args_to_stdout = False
inject_facts_as_vars = False
fact_caching = memory
forks = 1
timeout = 8
no_target_syslog = True

[inventory]
enable_plugins = host_list,yaml

[ssh_connection]
password_mechanism = ssh_askpass
pipelining = True
retries = 0
ssh_args = -o ControlMaster=no -o ControlPath=none -o StrictHostKeyChecking=yes -o UpdateHostKeys=no -o NumberOfPasswordPrompts=1 -o ConnectionAttempts=1 -o ServerAliveInterval=5 -o ServerAliveCountMax=2 -o ForwardAgent=no -o ClearAllForwardings=yes
