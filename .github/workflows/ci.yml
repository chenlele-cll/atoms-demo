name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      full_lifecycle:
        description: Run full lifecycle acceptance on macOS arm64
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality (Ubuntu)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
          cache: true
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint, types and backend tests
        run: pnpm check
      - name: Empty infrastructure tests
        run: pnpm test:infra
      - name: Build and browser smoke
        run: |
          google-chrome --version
          pnpm smoke
      - name: Validate OpenSpec artifacts
        run: pnpm openspec validate --all --strict --no-interactive
      - name: Upload browser evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-smoke-ubuntu
          path: test-results/smoke/*.png
          if-no-files-found: ignore
          retention-days: 7

  lifecycle:
    name: Full lifecycle (macOS)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.full_lifecycle }}
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
          cache: true
      - name: Bootstrap fixed project tools and dependencies
        run: ./manager.sh bootstrap
      - name: Complete local acceptance
        run: pnpm verify
      - name: Upload lifecycle evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: full-lifecycle-macos
          path: |
            test-results/smoke/*.png
            test-results/manager/**/report.json
          if-no-files-found: ignore
          retention-days: 7
